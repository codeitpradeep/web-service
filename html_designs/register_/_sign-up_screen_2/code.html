<h2 class="text-3xl font-bold tracking-tight text-[var(--text-primary)] sm:text-4xl">Create your Profile</h2>
<p class="mt-2 text-sm text-[var(--text-secondary)]">Join the largest Tamil matrimonial service and find your perfect match.</p>
</div>
<div class="bg-white p-8 rounded-2xl shadow-lg border border-[var(--border-color)]">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-[var(--text-primary)] mb-2">This profile is for a</label>
<div class="grid grid-cols-2 gap-4">

</label>
<label class="flex items-center p-4 rounded-lg border border-[var(--border-color)] cursor-pointer hover:bg-[var(--secondary-color)] transition-colors">
<input class="form-radio text-[var(--primary-color)] focus:ring-[var(--primary-color)]" name="account_type" type="radio" value="family"/>

</label>
<label class="flex items-center p-4 rounded-lg border border-[var(--border-color)] cursor-pointer hover:bg-[var(--secondary-color)] transition-colors">
<input class="form-radio text-[var(--primary-color)] focus:ring-[var(--primary-color)]" name="account_type" type="radio" value="agent"/>

</div>

<div class="border-t border-[var(--border-color)] my-6"></div>

<div>

</div>
<div>

<select class="block w-full rounded-lg border border-[var(--border-color)] bg-[var(--secondary-color)] py-3 px-4 text-base text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]" id="religion" name="religion" required="">
<option selected="" value="">Select Religion</option>
<option>Hindu</option>
<option>Christian</option>
<option>Muslim</option>
<option>Jain</option>
<option>Sikh</option>
<option>Buddhist</option>

</div>
<div>

<option>Malayalam</option>
<option>Kannada</option>
<option>Hindi</option>
<option>English</option>
</select>
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

</div>
<div>

<input class="block w-full rounded-lg border border-[var(--border-color)] bg-[var(--secondary-color)] py-3 pl-12 pr-4 text-base text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]" id="phone-number" name="phone-number" placeholder="Enter mobile number" required="" type="tel"/>
</div>
</div>
</div>
<div class="border-t border-[var(--border-color)] my-6"></div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>

<div class="relative">
<input class="block w-full rounded-lg border border-[var(--border-color)] bg-[var(--secondary-color)] py-3 px-4 text-base text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]" id="password" name="password" placeholder="Enter a strong password" required="" type="password"/>

</div>

</div>
</div>
