<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
    :root {
      --primary-color: #ec5413;
      --primary-color-light: #fdede8;
      --text-primary: #1b120d;
      --text-secondary: #9a634c;

      -moz-appearance: none;
      appearance: none;
    }
  </style>
</head>
<body class="bg-bg-color text-text-primary">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-border-color px-6 sm:px-10 py-4">
<div class="flex items-center gap-4 text-text-primary">
<div class="size-8 text-primary-color">
<svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM8.46 15.12c.5.51 1.18.8 1.93.84L12 18l1.61-2.04c.75-.04 1.43-.33 1.93-.84.5-.5.8-1.18.84-1.93L18 12l-2.04-1.61c-.04-.75-.34-1.43-.84-1.93-.5-.5-1.18-.8-1.93-.84L12 6l-1.61 2.04c-.75.04-1.43.33-1.93.84-.5.5-.8 1.18-.84 1.93L6 12l2.04 1.61c.04.75.34 1.43.84 1.93z"></path></svg>
</div>
<h1 class="text-xl font-bold tracking-tight">தமிழ் மேட்ரிமோனி</h1>
</div>
<div class="hidden md:flex items-center gap-6">
<a class="text-sm font-medium hover:text-primary-color transition-colors" href="#">Home</a>
<a class="text-sm font-medium hover:text-primary-color transition-colors" href="#">Search</a>
<a class="text-sm font-medium hover:text-primary-color transition-colors" href="#">Matches</a>
<a class="text-sm font-medium hover:text-primary-color transition-colors" href="#">Premium</a>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center rounded-md px-4 py-2 text-sm font-medium text-text-secondary hover:bg-border-color transition-colors">
<span>English</span>
<span class="mx-1">/</span>
<span>தமிழ்</span>
</button>
<div class="size-10 rounded-full bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBZ2-Qd-z6WL-kgFAq30mKJCZIPKUV0a2NqPh56lu3V_KGnmaqErvcR-GhxWgFgoWZ1EsdyfFwwVYS9bAFaC9iNqj-A0LGU5sGdie-I3ryNR_a6U5-tOxJncoFlMragW1XFHwXrpJb0umyJ4RrxV1lmFGy7eVb37YJiOqYrLwjec1PlFCnlWFMIenKotll1HuvMvN-bwYlgkz2DNXJ18FIxj5QRuluN09KZdHv-uYr1668NaORiT3gPGGk9Qjc0w_L_dIx0Ph0OQTvT");'></div>
</div>
</header>
<main class="flex flex-1 justify-center py-8 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-4xl">
<div class="text-center mb-8">
<h2 class="text-3xl sm:text-4xl font-bold tracking-tight text-text-primary">Create Your Profile</h2>
<p class="mt-2 text-lg text-text-secondary">Fill in your details to find your perfect match.</p>
</div>
<div class="mb-8">
<div class="flex border-b border-input-border-color justify-center">
<nav aria-label="Tabs" class="flex space-x-2 sm:space-x-8 -mb-px">
<a aria-current="page" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-primary-color border-primary-color" href="#"> Personal Info </a>
<a class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-text-secondary hover:text-text-primary hover:border-gray-300 border-transparent" href="#"> Education/Career </a>
<a class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-text-secondary hover:text-text-primary hover:border-gray-300 border-transparent" href="#"> Family </a>
<a class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-text-secondary hover:text-text-primary hover:border-gray-300 border-transparent" href="#"> Preferences </a>
<a class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm text-text-secondary hover:text-text-primary hover:border-gray-300 border-transparent" href="#"> Photo Uploads </a>
</nav>
</div>
</div>
<div class="bg-white p-6 sm:p-8 rounded-lg shadow-md">
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
<div class="md:col-span-2">
<label class="block text-sm font-medium text-text-primary" for="name">Name</label>
<input class="mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color" id="name" name="name" placeholder="Enter your full name" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="gender">Gender</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="gender" name="gender">
<option>Select your gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="dob">Date of Birth</label>
<input class="mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="dob" name="dob" type="date"/>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="marital-status">Marital Status</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="marital-status" name="marital-status">
<option>Select your marital status</option>
<option>Never Married</option>
<option>Divorced</option>
<option>Widowed</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="religion">Religion</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="religion" name="religion">
<option>Select your religion</option>
<option>Hindu</option>
<option>Christian</option>
<option>Muslim</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="mother-tongue">Mother Tongue</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="mother-tongue" name="mother-tongue">
<option>Select your mother tongue</option>
<option>Tamil</option>
<option>Telugu</option>
<option>Kannada</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="caste">Caste/Community</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="caste" name="caste">
<option>Select your caste/community</option>
<option>Caste 1</option>
<option>Caste 2</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="sub-caste">Sub-Caste (Optional)</label>
<input class="mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color" id="sub-caste" name="sub-caste" placeholder="Enter your sub-caste" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="country">Country Living In</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="country" name="country">
<option>Select your country</option>
<option>India</option>
<option>USA</option>
<option>Singapore</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="state">State Living In</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="state" name="state">
<option>Select your state</option>
<option>Tamil Nadu</option>
<option>Karnataka</option>
<option>Kerala</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-text-primary" for="city">City Living In</label>
<select class="form-select mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color text-text-secondary" id="city" name="city">
<option>Select your city</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Madurai</option>
</select>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-text-primary" for="phone">Contact Number</label>
<input class="mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color" id="phone" name="phone" placeholder="Enter your contact number" type="tel"/>
</div>
<div class="md:col-span-2">
<label class="block text-sm font-medium text-text-primary" for="email">Email Address</label>
<input class="mt-1 block w-full rounded-md border-input-border-color shadow-sm focus:border-primary-color focus:ring-primary-color sm:text-sm py-3 px-4 bg-bg-color" id="email" name="email" placeholder="Enter your email address" type="email"/>
</div>
</div>
<div class="mt-8 flex justify-end gap-4">
<button class="px-6 py-3 border border-transparent text-sm font-medium rounded-md text-text-primary bg-border-color hover:bg-input-border-color focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-color transition-colors" type="button">
                    Preview
                </button>
<button class="px-6 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-primary-color hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-color transition-colors" type="submit">
                    Next: Education/Career
                </button>
</div>
</div>
</div>
</main>
</div>

</body></html>
